<div class="min-h-screen bg-[#FFFBF0] py-10 px-4">
    <div class="max-w-2xl mx-auto">
      <div class="bg-white rounded-[32px] p-8 shadow-xl border border-orange-50">
        <h2 class="text-3xl font-black text-orange-900 text-center mb-8 uppercase tracking-tighter">Новое заведение</h2>
  
        <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 text-red-600 rounded-2xl font-bold text-sm text-center animate-shake">
          ⚠️ {{ errorMessage }}
        </div>
  
        <form [formGroup]="venueForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="group flex flex-col items-center justify-center border-2 border-dashed border-orange-100 rounded-3xl p-6 bg-orange-50/30 hover:bg-orange-50 transition-all cursor-pointer relative overflow-hidden">
            <input type="file" (change)="onFileSelected($event)" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-20">
            <div *ngIf="!imagePreview" class="text-center">
              <span class="text-5xl mb-2 block">📸</span>
              <p class="text-orange-900 font-black uppercase text-xs tracking-widest">Загрузить обложку</p>
            </div>
            <div *ngIf="imagePreview" class="relative w-full h-56">
              <img [src]="imagePreview" class="w-full h-full object-cover rounded-2xl shadow-lg group-hover:scale-105 transition-transform duration-500">
              <div class="absolute inset-0 bg-black/20 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                 <span class="text-white font-bold text-sm">Сменить фото</span>
              </div>
            </div>
          </div>
  
          <div class="space-y-4">
            <input type="text" formControlName="name" placeholder="Название заведения"
                   class="w-full px-6 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition-all font-medium">
            
            <input type="text" formControlName="address" placeholder="Адрес (ул. Абая, 15)"
                   class="w-full px-6 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition-all font-medium">
  
            <textarea formControlName="description" rows="3" placeholder="Описание заведения..."
                      class="w-full px-6 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition-all resize-none font-medium"></textarea>
            
            <div class="flex items-center justify-between p-5 bg-orange-50/50 rounded-2xl border border-orange-100/50">
              <div>
                <p class="font-bold text-orange-900 text-sm">Доступна доставка?</p>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Курьер привезет заказ клиенту</p>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" formControlName="canDeliver" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-600"></div>
              </label>
            </div>
          </div>
  
          <button type="submit" [disabled]="venueForm.invalid || !selectedFile || isLoading"
                  class="w-full bg-orange-600 hover:bg-orange-700 disabled:bg-gray-300 text-white font-black py-5 rounded-2xl shadow-xl shadow-orange-100 transition-all flex justify-center items-center gap-3">
            <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
            <span>{{ isLoading ? 'Создаем профиль...' : 'Создать заведение' }}</span>
          </button>
        </form>
      </div>
    </div>
  </div>
