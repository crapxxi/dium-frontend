<div class="min-h-[calc(100vh-72px)] bg-[#FFFBF0] flex items-center justify-center py-12 px-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-[2rem] shadow-xl shadow-orange-100/50 border border-orange-50 p-8 animate-in fade-in zoom-in duration-300">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-orange-900 tracking-tight mb-2">{{ 'REGISTER.TITLE' | translate }}</h1>
      <p class="text-gray-500 font-medium">{{ 'REGISTER.SUBTITLE' | translate }}</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-5">
      
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">{{ 'REGISTER.NAME_LABEL' | translate }}</label>
        <input type="text" name="name" [(ngModel)]="registerData.name" required minlength="2"
               #name="ngModel"
               class="w-full px-5 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-orange-500 focus:ring-0 outline-none transition-all font-medium text-gray-800 placeholder:font-normal"
               [class.border-red-400]="name.invalid && name.touched"
               [placeholder]="'REGISTER.NAME_PLACE' | translate">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">{{ 'AUTH.PHONE_LABEL' | translate }}</label>
        <input type="tel" name="phone" [(ngModel)]="registerData.phone" required
               pattern="^[0-9\s()+\-]{10,18}$" #phone="ngModel"
               inputmode="tel" autocomplete="tel"
               class="w-full px-5 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-orange-500 focus:ring-0 outline-none transition-all font-medium text-gray-800 placeholder:font-normal"
               [class.border-red-400]="phone.invalid && phone.touched"
               placeholder="8 707 123 45 67">
        <p *ngIf="phone.invalid && phone.touched" class="text-[10px] font-bold text-red-500 mt-1.5 ml-2 uppercase tracking-wide">
          {{ 'REGISTER.ERR_PHONE' | translate }}
        </p>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">{{ 'AUTH.PASSWORD_LABEL' | translate }}</label>
        <input type="password" name="password" [(ngModel)]="registerData.password" 
               #password="ngModel" required minlength="6"
               class="w-full px-5 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-orange-500 focus:ring-0 outline-none transition-all font-medium text-gray-800 placeholder:font-normal"
               [class.border-red-400]="password.invalid && password.touched"
               [placeholder]="'REGISTER.PW_PLACE' | translate">
        <p *ngIf="password.invalid && password.touched" class="text-[10px] font-bold text-red-500 mt-1.5 ml-2 uppercase tracking-wide">
          {{ 'REGISTER.ERR_PW' | translate }}
        </p>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">{{ 'REGISTER.CONFIRM_PW' | translate }}</label>
        <input type="password" name="confirmPassword" [(ngModel)]="registerData.confirmPassword" required
               class="w-full px-5 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-orange-500 focus:ring-0 outline-none transition-all font-medium text-gray-800 placeholder:font-normal"
               placeholder="••••••••">
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 text-red-600 font-bold text-sm p-4 rounded-xl border border-red-100 flex items-center gap-2 animate-in fade-in slide-in-from-top-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ errorMessage | translate }}
      </div>

      <button type="submit" [disabled]="!registerForm.valid || isLoading"
              class="w-full mt-2 bg-gradient-to-r from-orange-600 to-[#FF6B00] hover:from-orange-500 hover:to-orange-500 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-orange-200/50 active:scale-95 disabled:from-gray-300 disabled:to-gray-300 disabled:shadow-none disabled:scale-100 flex items-center justify-center gap-2">
              
          <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white/40 border-t-white rounded-full"></div>
          <span>{{ isLoading ? ('ADMIN.CREATING' | translate) : ('REGISTER.SUBMIT' | translate) }}</span>
      </button>

      <div class="text-center pt-4 border-t border-gray-100 mt-6">
        <p class="text-sm font-medium text-gray-500">
          {{ 'REGISTER.ALREADY_HAVE' | translate }} 
          <a routerLink="/login" class="text-[#FF6B00] font-black hover:underline transition-all">{{ 'NAV.LOGIN' | translate }}</a>
        </p>
      </div>
    </form>
  </div>
</div>
