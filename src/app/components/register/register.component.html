<div class="min-h-[calc(100vh-72px)] bg-[#FFFBF0] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-orange-100/50 border border-orange-100 p-8">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-orange-900 mb-2">{{ 'REGISTER.TITLE' | translate }}</h1>
      <p class="text-gray-500">{{ 'REGISTER.SUBTITLE' | translate }}</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-4">
      
      <div>
        <label class="block text-sm font-bold text-orange-800 mb-1 ml-1">{{ 'REGISTER.NAME_LABEL' | translate }}</label>
        <input type="text" name="name" [(ngModel)]="registerData.name" required minlength="2"
               #name="ngModel"
               class="w-full px-5 py-3 rounded-2xl border border-orange-100 focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 outline-none transition-all"
               [class.border-red-500]="name.invalid && name.touched"
               [placeholder]="'REGISTER.NAME_PLACE' | translate">
      </div>

      <div>
        <label class="block text-sm font-bold text-orange-800 mb-1 ml-1">{{ 'AUTH.PHONE_LABEL' | translate }}</label>
        <input type="tel" name="phone" [(ngModel)]="registerData.phone" required
               pattern="^\+?[0-9]{10,12}$" #phone="ngModel"
               class="w-full px-5 py-3 rounded-2xl border border-orange-100 focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 outline-none transition-all"
               [class.border-red-500]="phone.invalid && phone.touched"
               placeholder="+77071234567">
        <p *ngIf="phone.invalid && phone.touched" class="text-[10px] text-red-500 mt-1 ml-2">
          {{ 'REGISTER.ERR_PHONE' | translate }}
        </p>
      </div>

      <div>
        <label class="block text-sm font-bold text-orange-800 mb-1 ml-1">{{ 'AUTH.PASSWORD_LABEL' | translate }}</label>
        <input type="password" name="password" [(ngModel)]="registerData.password" 
               #password="ngModel" required minlength="6"
               class="w-full px-5 py-3 rounded-2xl border border-orange-100 focus:border-orange-500 outline-none transition-all"
               [class.border-red-500]="password.invalid && password.touched"
               [placeholder]="'REGISTER.PW_PLACE' | translate">
        <p *ngIf="password.invalid && password.touched" class="text-[10px] text-red-500 mt-1 ml-2">
          {{ 'REGISTER.ERR_PW' | translate }}
        </p>
      </div>

      <div>
        <label class="block text-sm font-bold text-orange-800 mb-1 ml-1">{{ 'REGISTER.CONFIRM_PW' | translate }}</label>
        <input type="password" name="confirmPassword" [(ngModel)]="registerData.confirmPassword" required
               class="w-full px-5 py-3 rounded-2xl border border-orange-100 focus:border-orange-500 outline-none transition-all"
               placeholder="••••••••">
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 text-red-500 text-sm p-3 rounded-xl border border-red-100">
        {{ errorMessage | translate }}
      </div>

      <button type="submit" [disabled]="!registerForm.valid"
              class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-orange-200 active:scale-95 disabled:opacity-50">
              <div *ngIf="isLoading" class="flex items-center justify-center">
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                  <path class="opacity-100" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              </div>
              <span>{{ isLoading ? ('ADMIN.CREATING' | translate) : ('REGISTER.SUBMIT' | translate) }}</span>
        </button>

      <div class="text-center pt-2">
        <p class="text-sm text-gray-500">
          {{ 'REGISTER.ALREADY_HAVE' | translate }} 
          <a routerLink="/login" class="text-orange-600 font-bold hover:underline">{{ 'NAV.LOGIN' | translate }}</a>
        </p>
      </div>
    </form>
  </div>
</div>
