<div class="min-h-[80vh] flex items-center justify-center bg-[#FFFBF0] px-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-orange-100/50 p-8 border border-orange-50 animate-in fade-in zoom-in duration-300">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black tracking-tight text-orange-900">{{ 'LOGIN.TITLE' | translate }}</h2>
      <p class="text-gray-500 mt-2 font-medium">{{ 'LOGIN.SUBTITLE' | translate }}</p>
    </div>

    <div *ngIf="errorMessage" 
         class="mb-6 p-4 bg-red-50 border border-red-100 rounded-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-2 duration-300">
      <div class="bg-red-500 text-white rounded-full p-1 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <p class="text-sm font-bold text-red-600 leading-tight">{{ errorMessage | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">{{ 'AUTH.PHONE_LABEL' | translate }}</label>
        <input type="text" formControlName="phone" 
               inputmode="numeric"
               [class.border-red-300]="errorMessage"
               class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-[#FF6B00] focus:ring-0 outline-none transition-all text-gray-800 font-medium placeholder:font-normal"
               placeholder="8 707 123 45 67">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">{{ 'AUTH.PASSWORD_LABEL' | translate }}</label>
        <input type="password" formControlName="password"
               [class.border-red-300]="errorMessage"
               class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-[#FF6B00] focus:ring-0 outline-none transition-all text-gray-800 font-medium placeholder:font-normal"
               placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading"
              class="w-full bg-gradient-to-r from-orange-600 to-[#FF6B00] hover:from-orange-500 hover:to-orange-500 disabled:from-gray-300 disabled:to-gray-300 text-white font-black py-4 rounded-xl shadow-lg shadow-orange-200/50 transition-all active:scale-95 flex items-center justify-center gap-2">
        <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white/40 border-t-white rounded-full"></div>
        <span>{{ isLoading ? ('LOGIN.SUBMITTING' | translate) : ('LOGIN.SUBMIT' | translate) }}</span>
      </button>
    </form>

    <p class="text-center mt-8 text-sm font-medium text-gray-600">
      {{ 'LOGIN.NO_ACCOUNT' | translate }} 
      <a routerLink="/register" class="text-[#FF6B00] font-black hover:underline transition-all">{{ 'LOGIN.CREATE_NOW' | translate }}</a>
    </p>

    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
      <a routerLink="/forgot-password" class="text-[10px] font-black text-gray-300 uppercase tracking-widest hover:text-orange-400 transition-colors">
        {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
      </a>
   </div>
  </div>
</div>
