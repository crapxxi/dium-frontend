<div class="min-h-[80vh] flex items-center justify-center bg-[#FFFBF0] px-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-orange-50">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-orange-900">С возвращением!</h2>
      <p class="text-gray-500 mt-2">Войдите, чтобы заказать любимую еду</p>
    </div>

    <div *ngIf="errorMessage" 
         class="mb-6 p-4 bg-red-50 border border-red-100 rounded-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-2 duration-300">
      <div class="bg-red-500 text-white rounded-full p-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <p class="text-sm font-bold text-red-600">{{ errorMessage }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Номер телефона</label>
        <input type="text" formControlName="phone" 
               [class.border-red-300]="errorMessage"
               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#FF6B00] focus:ring-2 focus:ring-orange-100 outline-none transition-all"
               placeholder="87071234567">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Пароль</label>
        <input type="password" formControlName="password"
               [class.border-red-300]="errorMessage"
               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#FF6B00] focus:ring-2 focus:ring-orange-100 outline-none transition-all"
               placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading"
              class="w-full bg-[#FF6B00] hover:bg-orange-600 disabled:bg-gray-300 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-200 transition-all transform active:scale-95 flex items-center justify-center gap-2">
        
        <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
        <span>{{ isLoading ? 'Проверка...' : 'Войти' }}</span>
      </button>
    </form>

    <p class="text-center mt-8 text-sm text-gray-600">
      Нет аккаунта? 
      <a routerLink="/register" class="text-[#FF6B00] font-bold hover:underline">Создать сейчас</a>
    </p>

    <div class="mt-8 pt-6 border-t border-gray-50 text-center">
      <a href="https://wa.me/77001234567" target="_blank" class="text-[9px] font-bold text-gray-300 uppercase tracking-[0.2em] hover:text-orange-400 transition-colors">
        Забыли пароль?
      </a>
   </div>

  </div>
</div>
