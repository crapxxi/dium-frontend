<main class="flex-1 bg-[#FFFBF0] min-h-screen pb-20">
  <div class="container mx-auto px-4 py-10 max-w-7xl">
    
    <div class="mb-12 border-b-4 border-orange-100 pb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <h1 class="text-5xl font-black text-orange-900 uppercase italic tracking-tighter leading-none mb-3">
          Заведения
        </h1>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-orange-400">
          Выбери место, где сегодня будет вкусно
        </p>
      </div>
      <div class="hidden md:block">
        <span class="text-[10px] font-black uppercase text-orange-900/20 tracking-widest">Almaty • 2026</span>
      </div>
    </div>

    <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-32">
      <div class="w-14 h-14 border-4 border-orange-100 border-t-orange-600 rounded-full animate-spin mb-4"></div>
      <p class="text-[10px] font-black uppercase tracking-[0.3em] text-orange-900/40">Ищем лучшие места...</p>
    </div>

    <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
      
      <div *ngFor="let venue of venues" 
           [routerLink]="venue.hasItemsInStock ? ['/venue', venue.id] : null"
           class="group bg-white flex flex-col rounded-[40px] overflow-hidden transition-all duration-500 border-2 border-orange-100 relative shadow-xl shadow-orange-900/5"
           [class.hover:border-orange-600]="venue.hasItemsInStock"
           [class.hover:-translate-y-2]="venue.hasItemsInStock"
           [class.cursor-pointer]="venue.hasItemsInStock"
           [class.opacity-60]="!venue.hasItemsInStock">
        
        <div class="relative h-64 overflow-hidden bg-gray-100">
          <img [src]="'http://localhost:8080' + venue.imageUrl" 
               [alt]="venue.name" 
               class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
               [class.grayscale]="!venue.hasItemsInStock">
          
          <div class="absolute inset-0 bg-gradient-to-t from-orange-900/40 via-transparent to-transparent"></div>

          <div *ngIf="!venue.hasItemsInStock" class="absolute inset-0 bg-white/40 backdrop-blur-[2px] z-10 flex items-center justify-center p-6">
            <span class="bg-gray-900 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-2xl border-2 border-white/20 text-center">
              Всё раскупили ⛔️
            </span>
          </div>

          <div *ngIf="venue.canDeliver && venue.hasItemsInStock" class="absolute top-6 right-6 z-20">
            <span class="bg-orange-600 text-white px-4 py-2 rounded-2xl text-[9px] font-black uppercase tracking-widest shadow-lg shadow-orange-600/30 border border-orange-400">
              🚚 Доставка
            </span>
          </div>
        </div>

        <div class="p-8 bg-white flex-1 flex flex-col relative">
          <div *ngIf="venue.hasItemsInStock" class="absolute -top-6 right-8 w-12 h-12 bg-white rounded-full border-2 border-orange-100 flex items-center justify-center text-orange-600 shadow-lg transition-all group-hover:bg-orange-600 group-hover:text-white group-hover:border-orange-600">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
          </div>

          <h3 class="text-2xl font-black text-orange-900 uppercase italic tracking-tighter leading-none mb-3 group-hover:text-orange-600 transition-colors">
            {{ venue.name }}
          </h3>
          
          <p class="text-[11px] font-bold text-gray-400 mb-6 line-clamp-2 leading-relaxed uppercase tracking-tight italic">
            {{ venue.description }}
          </p>

          <div class="mt-auto pt-6 border-t border-orange-50 flex items-center justify-between">
            <div class="flex items-center gap-2 text-orange-900/40 group-hover:text-orange-600 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span class="text-[9px] font-black uppercase tracking-widest truncate max-w-[180px]">{{ venue.address }}</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div *ngIf="!isLoading && venues.length === 0" class="flex flex-col items-center justify-center py-40 text-center">
      <div class="w-24 h-24 bg-orange-50 rounded-[40px] flex items-center justify-center text-5xl mb-8 grayscale opacity-20 border-2 border-orange-100">
        🏙️
      </div>
      <h2 class="text-4xl font-black text-orange-900/10 uppercase italic tracking-tighter">Город спит...</h2>
      <p class="text-[10px] font-black text-orange-900/20 uppercase tracking-[0.4em] mt-4">Заведений пока не найдено</p>
    </div>

  </div>
</main>
