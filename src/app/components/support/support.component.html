<main class="min-h-screen bg-[#FFFBF0] py-10 pb-24 font-sans">
    <div class="max-w-2xl mx-auto px-4">
      
      <div class="text-center mb-12">
        <div class="inline-block bg-orange-600 p-4 rounded-[32px] shadow-xl shadow-orange-200 mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>
        <h1 class="text-4xl font-black text-orange-900 uppercase italic tracking-tighter mb-2">Поддержка</h1>
        <p class="text-[10px] font-black uppercase text-orange-400 tracking-[0.3em]">Мы на связи 24/7 (почти)</p>
      </div>
  
      <div class="grid grid-cols-1 gap-4 mb-12">
        <a href="{{ contacts.whatsapp }}" target="_blank" 
           class="group bg-white p-6 rounded-[32px] border-2 border-orange-50 shadow-xl shadow-orange-900/5 flex items-center justify-between hover:border-green-400 transition-all active:scale-95">
          <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-green-50 rounded-2xl flex items-center justify-center text-3xl"><svg 
                viewBox="0 0 24 24" 
                xmlns="http://www.w3.org/2000/svg" 
                class="w-6 h-6 fill-current">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg></div>
            <div>
              <h3 class="font-black text-orange-900 uppercase text-sm tracking-tight">Написать в WhatsApp</h3>
              <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">Отвечаем за 5 минут</p>
            </div>
          </div>
          <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-green-500 group-hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
          </div>
        </a>
  
        <a href="{{ contacts.telegram }}" target="_blank" 
           class="group bg-white p-6 rounded-[32px] border-2 border-orange-50 shadow-xl shadow-orange-900/5 flex items-center justify-between hover:border-blue-400 transition-all active:scale-95">
          <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-3xl"><svg 
                viewBox="0 0 24 24" 
                xmlns="http://www.w3.org/2000/svg" 
                class="w-6 h-6 fill-current">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.891 8.146l-2.003 9.464c-.149.659-.541.821-1.091.511l-3.051-2.249-1.472 1.417c-.163.163-.3.298-.614.298l.219-3.107 5.654-5.111c.245-.219-.054-.341-.381-.123l-6.99 4.401-3.012-.942c-.655-.204-.667-.655.136-.967l11.772-4.537c.544-.203 1.021.124.833.945z"/>
              </svg></div>
            <div>
              <h3 class="font-black text-orange-900 uppercase text-sm tracking-tight">Telegram Чат</h3>
            </div>
          </div>
          <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
          </div>
        </a>
      </div>
  
      <div class="space-y-4">
        <h2 class="text-xs font-black text-orange-900 uppercase tracking-[0.3em] ml-6 mb-6">Частые вопросы:</h2>
        
        <div *ngFor="let faq of faqs; let i = index" 
             class="bg-white rounded-[28px] border-2 border-orange-50 overflow-hidden">
          <button (click)="faq.isOpen = !faq.isOpen" 
                  class="w-full p-6 text-left flex justify-between items-center hover:bg-orange-50/30 transition-colors">
            <span class="font-black text-orange-900 uppercase text-[11px] tracking-tight">{{ faq.q }}</span>
            <span class="text-orange-300 font-bold transition-transform" [class.rotate-180]="faq.isOpen">▼</span>
          </button>
          <div *ngIf="faq.isOpen" class="p-6 pt-0 animate-in slide-in-from-top-2 duration-300">
            <p class="text-sm font-medium text-gray-500 italic leading-relaxed">{{ faq.a }}</p>
          </div>
        </div>
      </div>
  
    </div>
  </main>
