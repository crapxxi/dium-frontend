<div class="min-h-[80vh] flex items-center justify-center bg-[#FFFBF0] px-4 font-sans">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-orange-100/50 p-8 border border-orange-50 animate-in fade-in zoom-in duration-300">
      
      <div class="text-center mb-8">
        <h2 class="text-3xl font-black tracking-tight text-orange-900">Восстановление</h2>
        <p class="text-gray-500 mt-2 font-medium">
          {{ step === 1 ? 'Введите номер телефона для сброса пароля' : 'Придумайте новый пароль' }}
        </p>
      </div>
  
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-100 rounded-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-2">
        <div class="bg-red-500 text-white rounded-full p-1 shadow-sm shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <p class="text-sm font-bold text-red-600 leading-tight">{{ errorMessage }}</p>
      </div>
  
      <form *ngIf="step === 1" (ngSubmit)="onRequestCode()" class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Номер телефона</label>
          <input type="tel" [(ngModel)]="phone" name="phone"
                 inputmode="numeric" required
                 class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-[#FF6B00] focus:ring-0 outline-none transition-all text-gray-800 font-medium placeholder:font-normal"
                 placeholder="8 707 123 45 67">
        </div>
  
        <button type="submit" [disabled]="!phone || isLoading"
                class="w-full bg-gradient-to-r from-orange-600 to-[#FF6B00] hover:from-orange-500 hover:to-orange-500 disabled:from-gray-300 disabled:to-gray-300 text-white font-black py-4 rounded-xl shadow-lg shadow-orange-200/50 transition-all active:scale-95 flex items-center justify-center gap-2">
          <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white/40 border-t-white rounded-full"></div>
          <span>{{ isLoading ? 'Отправка...' : 'Получить код' }}</span>
        </button>
      </form>
  
      <form *ngIf="step === 2" (ngSubmit)="onResetPassword()" class="space-y-5">
        <div class="bg-orange-50/50 p-4 rounded-xl border border-orange-100 mb-4 text-center">
          <p class="text-xs font-bold text-orange-800 uppercase tracking-widest mb-2">Код из SMS</p>
          <input [(ngModel)]="code" name="code"
                 type="text" inputmode="numeric" maxlength="4" required
                 class="w-full h-14 text-center text-3xl font-black tracking-[1rem] pl-[1rem] border-2 border-white bg-white rounded-xl focus:border-orange-500 outline-none transition-all text-gray-800"
                 placeholder="0000">
        </div>
  
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Новый пароль</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="6"
                 class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-orange-500 focus:ring-0 outline-none transition-all font-medium text-gray-800"
                 placeholder="Минимум 6 символов">
        </div>
  
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Повторите пароль</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                 class="w-full px-4 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50/50 focus:bg-white focus:border-orange-500 focus:ring-0 outline-none transition-all font-medium text-gray-800"
                 placeholder="••••••••">
        </div>
  
        <button type="submit" [disabled]="code.length < 4 || !newPassword || !confirmPassword || isLoading"
                class="w-full mt-2 bg-gradient-to-r from-orange-600 to-[#FF6B00] hover:from-orange-500 hover:to-orange-500 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-orange-200/50 active:scale-95 disabled:from-gray-300 disabled:to-gray-300 flex items-center justify-center gap-2">
          <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white/40 border-t-white rounded-full"></div>
          <span>{{ isLoading ? 'Сохранение...' : 'Сбросить пароль' }}</span>
        </button>
      </form>
  
      <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <a routerLink="/login" class="group inline-flex items-center gap-2 text-[10px] font-black text-gray-400 uppercase tracking-widest hover:text-orange-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
          Вспомнил пароль
        </a>
      </div>
  
    </div>
  </div>
